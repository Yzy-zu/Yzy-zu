<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">
  <style>text { font: 700 34px 'Trebuchet MS', 'Segoe UI', sans-serif; }</style>
  <text x="450" y="55" text-anchor="middle" fill="#A78BFA" opacity="0">Turning ideas into useful software<animate attributeName="opacity" values="0;1;1;0" dur="9s" begin="0s" repeatCount="indefinite"/></text>
  <text x="450" y="55" text-anchor="middle" fill="#22D3EE" opacity="0">Making complex systems feel simple<animate attributeName="opacity" values="0;1;1;0" dur="9s" begin="3s" repeatCount="indefinite"/></text>
  <text x="450" y="55" text-anchor="middle" fill="#34D399" opacity="0">Learning by building, always<animate attributeName="opacity" values="0;1;1;0" dur="9s" begin="6s" repeatCount="indefinite"/></text>
</svg>
